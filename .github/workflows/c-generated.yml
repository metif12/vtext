# C-generated distributable: the library as plain C, committed on every push.
#
# A C user without the V toolchain cannot build from .v sources, so each
# platform regenerates the V-to-C translation of the module, vendors the
# V-tree headers that translation includes (tools/c_bundle.py rewrites the
# absolute include paths and refuses a partial bundle), and proves the result
# builds with the platform compiler alone: no V on PATH is consulted, no V
# include directory is passed. The smoke test then builds and runs against
# exactly that bundle. Only after all three platforms prove their bundle does
# the assemble job commit generated/ with [skip ci].
#
# Why one file per platform: V resolves $if windows/linux/macos at
# translation time, so the emitted C is platform-specific. The three files
# share nothing and are regenerated by their own runner.
#
# Why the commit is separate from the matrix: a linux link failure (say, a
# new V version emitting a call whose definition lives in another companion
# source) must fail the run, not land two platforms' output beside a stale
# third. The assemble job downloads all three artifacts and commits only
# when every platform produced one.
#
# The per-platform companion sources (--runtime-c) are part of the build
# contract, not discovered: the generated C declares symbols it never
# defines (on Windows, the SEH thunk in core_windows.c), and the link names
# them if the list is wrong. An empty list means the link needs nothing
# beyond the C file on that platform today.

name: c-generated

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: c-generated-commit
  cancel-in-progress: false

jobs:
  generate:
    name: C bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
            cc: gcc
            cfile: harfara.linux.c
            lib: libharfara.so
            runtime_c: ''
          - os: macos-latest
            slug: macos
            cc: clang
            cfile: harfara.macos.c
            lib: libharfara.dylib
            runtime_c: ''
          - os: windows-latest
            slug: windows
            cc: gcc
            cfile: harfara.windows.c
            lib: harfara.dll
            runtime_c: vlib/builtin/core_windows.c
    steps:
      - uses: actions/checkout@v4

      - name: Install V (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/vsrc"
          git clone --depth 1 https://github.com/vlang/v "$src"
          make -C "$src" -j2
          echo "$src" >> "$GITHUB_PATH"

      - name: Install V (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/vlang/v %RUNNER_TEMP%\vsrc
          pushd %RUNNER_TEMP%\vsrc
          call makev.bat
          echo %RUNNER_TEMP%\vsrc>>"%GITHUB_PATH%"

      - name: v version
        run: v version

      # -gc none is load-bearing rather than an optimisation: with the Boehm
      # collector the library would free objects the C caller still holds,
      # and the caller has no handle the collector can see (same flag as the
      # clib job in ci.yml).
      - name: Translate the module to C
        shell: bash
        run: v -shared -gc none -cc ${{ matrix.cc }} -o gen.c .
        env:
          VJOBS: '1'

      # The bundle step is the whole point of this workflow: gen.c names the
      # V checkout by absolute path, so it builds nowhere else. The script
      # vendors those headers beside the C file, rewrites the includes, and
      # refuses instead of writing a partial bundle.
      - name: Bundle the C file with its V-tree headers
        shell: bash
        run: |
          set -euo pipefail
          args=("$RUNNER_TEMP/vsrc" gen.c "generated/${{ matrix.slug }}/${{ matrix.cfile }}" "generated/${{ matrix.slug }}/thirdparty")
          if [ -n "${{ matrix.runtime_c }}" ]; then args+=(--runtime-c "${{ matrix.runtime_c }}"); fi
          python3 tools/c_bundle.py "${args[@]}"

      # From here on V is not consulted: the platform compiler builds the
      # committed layout exactly as generated/README.md documents it. A
      # passing step means a C user with no V toolchain gets a library.
      - name: Build the library from the bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd generated/linux
          gcc -shared -fPIC -o libharfara.so harfara.linux.c -I.

      - name: Build the library from the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd generated/macos
          clang -dynamiclib -o libharfara.dylib harfara.macos.c -I.
          otool -D libharfara.dylib || true
          install_name_tool -id @rpath/libharfara.dylib libharfara.dylib
          otool -D libharfara.dylib

      - name: Build the library from the bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd generated/windows
          gcc -shared -o harfara.dll harfara.windows.c thirdparty/vlib/builtin/core_windows.c -I. -static-libgcc

      # The smoke test compiles against the repo headers and links the
      # bundled library, the way a downstream user would: headers from the
      # tree, binary from generated/.
      - name: MinGW import library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: dlltool -d harfara.def --dllname harfara.dll -l generated/windows/libharfara.dll.a

      - name: Build the smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -Lgenerated/windows -lharfara -static-libgcc -o examples/c-api/smoke.exe
          cp generated/windows/harfara.dll examples/c-api/
          for d in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            f=$(gcc -print-file-name=$d)
            if [ -f "$f" ]; then cp "$f" examples/c-api/; fi
          done
          objdump -p examples/c-api/smoke.exe | grep 'DLL Name' || true

      - name: Build the smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -Lgenerated/linux -lharfara -Wl,-rpath,'$ORIGIN' -o examples/c-api/smoke
          cp generated/linux/libharfara.so examples/c-api/

      - name: Build the smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -Lgenerated/macos -lharfara -Wl,-rpath,@loader_path -o examples/c-api/smoke
          cp generated/macos/libharfara.dylib examples/c-api/

      # Two font arguments: the second exercises variable instancing through
      # the bundled library, which is the one C API the raw translation
      # could most plausibly miscompile.
      - name: Run the smoke test (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ls -la
          code=0
          ./smoke ../../testdata/fonts/Amiri-Regular.ttf ../../testdata/fonts/FiraCode-Variable.ttf || code=$?
          echo "smoke exit: $code"
          exit $code
        working-directory: examples/c-api

      - name: Run the smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          dir
          smoke.exe ..\..\testdata\fonts\Amiri-Regular.ttf ..\..\testdata\fonts\FiraCode-Variable.ttf
          echo smoke exit: %ERRORLEVEL%
          exit /b %ERRORLEVEL%
        working-directory: examples/c-api

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: c-gen-${{ matrix.slug }}
          path: generated/${{ matrix.slug }}

  assemble:
    name: commit the bundles
    needs: generate
    # Pushes to master only: pull requests prove their bundles build (the
    # matrix above runs for them) but must not write to the tree. Forks have
    # no push permission anyway; the condition keeps the intent explicit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the three bundles
        uses: actions/download-artifact@v4
        with:
          path: generated
          pattern: c-gen-*
          merge-multiple: false

      # The artifacts land as generated/c-gen-<slug>/<files>; flatten to
      # generated/<slug>/<files>, which is the committed layout.
      - name: Commit the regenerated bundles
        shell: bash
        run: |
          set -euo pipefail
          for slug in linux macos windows; do
            mkdir -p "generated/$slug"
            cp -r "generated/c-gen-$slug/." "generated/$slug/"
            rm -rf "generated/c-gen-$slug"
          done
          git config user.name 'harfara-cgen-bot'
          git config user.email 'harfara-cgen-bot@users.noreply.github.com'
          git add generated/
          if git diff --cached --quiet; then
            echo 'no bundle change; nothing to commit'
          else
            git commit -m 'c-generated: refresh the C bundles [skip ci]'
            git push
          fi
