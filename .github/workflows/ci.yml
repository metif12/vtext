# The suite runs on every push, on all three platforms, because until now it ran on one.
#
# Every test in this repository used to read its fonts from C:\Windows\Fonts, which meant every claim in it
# was a claim about this machine. The fonts the tests need are now committed under testdata/fonts and carry
# their licences, so the same checks run here, on Linux and on macOS, and the platform the claims were
# actually made on is no longer a guess.
#
# What a run on each platform proves:
#
#   ubuntu, macos    the corpus: parsing, shaping, GPOS, GSUB, bidi, line breaking, normalisation, and
#                    every assertion that is about the engine rather than about one font. This is where the
#                    claim used to be unverifiable, and it is the reason this workflow exists.
#   windows          the same, plus the Windows-only measurements, which still run wherever those fonts
#                    happen to be installed. On a runner they are not, so they skip and say so.
#
# A second job, differential shaping, runs beside the suite on ubuntu-latest and nowhere else, because only
# there does the fourth reference exist: libpango ships with the runner's image and pip installs the other
# three. It runs tools/difftest/compare.py, which dumps every case through this repository's own shaper and
# lays HarfBuzz, fontTools, Pillow and Pango beside it. The baseline in tools/difftest/baseline.tsv records
# every difference measured on the day it was written, eighty of them, so a green job means no new
# difference and no fixed one left unrecorded: both directions fail, and both print what changed.
#
# V is built from source rather than taken from the latest release, and that is not a preference. Measured
# twice, on 2026-10-13:
#
#   1. the latest release, 0.5.2 7647ce1, cannot compile this repository at all. brackets.v declares a
#      method on `&[]BracketPair`, and that build rejects it as a hard error: "V arrays are already
#      references behind the scenes". The file is not this change's to rewrite.
#
#   2. the same release has no os.exec_opt, which tools/run_tests.v calls, and answers "Did you mean
#      os.execute_opt?".
#
# A compiler built from master does both, and it is what this repository is developed against. So the
# workflow clones V and builds it, using each platform's own bootstrap: make on Linux and macOS, makev.bat
# on Windows, which is what V's own continuous integration does on its Windows runners.
#
# What a red run means is not always a defect: a test that needs a font only Windows ships skips itself and
# prints why, and tools/run_tests.v counts those skips and names every file in which every test skipped. A
# file that cannot run at all is recorded in testdata/blocked.txt with its reason and is reported as
# BLOCKED rather than passed. So the number to read is the one the runner prints:
#
#   Summary for all V _test.v files: N passed, 0 failed, K blocked, 29 total
#
# and a green job with K blocked is a job that proved what it could prove here and said what it could not.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v4

      # The compiler. A shallow clone of master is enough: V builds from a single C file that ships in the
      # repository, so there is no bootstrap compiler to find first.
      #
      # The two platforms that build with make get a bash step, and Windows gets a cmd step, because
      # makev.bat is a batch file and driving one through git-bash's cmd shim is where quoting goes to die.
      # Each step puts the build's own directory on PATH, which is the whole of the installation: the
      # compiler finds vlib beside itself, and tools/run_tests.v finds it through VEXE.
      - name: Install V (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/vsrc"
          git clone --depth 1 https://github.com/vlang/v "$src"
          make -C "$src" -j2
          echo "$src" >> "$GITHUB_PATH"

      - name: Install V (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/vlang/v %RUNNER_TEMP%\vsrc
          pushd %RUNNER_TEMP%\vsrc
          call makev.bat
          echo %RUNNER_TEMP%\vsrc>>"%GITHUB_PATH%"

      - name: v version
        run: v version

      # The formatter gate first, because a suite that does not compile cannot be measured and the
      # formatter is what makes a diff reviewable. It is the same tool this repository used before there
      # was a workflow, and it knows about the two files `v fmt` cannot handle.
      - name: v run tools/fmt_check.v
        run: v run tools/fmt_check.v

      # The real suite: every _test.v file in the module, one at a time, with the counts printed.
      #
      # VTEXT_CC names the C compiler for the platform: macOS ships a clang behind the name gcc, so the
      # runner asks for it by its own name and a failure in the C toolchain says which one it was.
      - name: v run tools/run_tests.v
        run: v run tools/run_tests.v
        env:
          VTEXT_CC: ${{ matrix.cc }}

  difftest:
    name: differential shaping (ubuntu 24.04)
    # Pinned to 24.04, not latest: this job compares against system Pango and
    # FreeType (via Pillow's bundled copy), and ubuntu-latest moved to 26.04
    # with a different system stack that measures differently. The baseline
    # below was recorded on 24.04; a runner move is a reference change, not an
    # engine change, so the runner is part of the harness version.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/vsrc"
          git clone --depth 1 https://github.com/vlang/v "$src"
          make -C "$src" -j2
          echo "$src" >> "$GITHUB_PATH"

      # The Pango leg dlopens these; the runner image usually has them, and the install makes
      # "usually" into a guarantee the job does not have to think about again.
      - name: System libraries for the Pango leg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libcairo2

      # Pinned to the versions the baseline was verified against (locally: 0 new,
      # 0 stale with Pillow 12.3.0, fontTools 4.66.1, uharfbuzz 0.56.2; the
      # pangocffi trio are the versions pango_leg.py was read against). An
      # unpinned install drifts with every release and the ratchet then
      # measures the reference moving, not the engine. `pip freeze` records
      # what actually ran, so a future drift has a version to blame.
      - name: pip install the pinned reference stack
        shell: bash
        run: |
          python3 -m pip install --quiet \
            uharfbuzz==0.56.2 fonttools==4.66.1 pillow==12.3.0 \
            pangocffi==0.14.1 pangocairocffi==0.7.1 cairocffi==1.7.1
          python3 -m pip freeze | grep -Ei 'harfbuzz|fonttools|pillow|pango|cairo'

      # Fifty-seven known differences are recorded in the baseline, so green means nothing new and
      # nothing fixed-without-a-record: both directions fail and say which.
      - name: python3 tools/difftest/compare.py
        shell: bash
        run: python3 tools/difftest/compare.py
        env:
          TMPDIR: ${{ runner.temp }}/difftest
          VJOBS: '1'

  clib:
    # The C ABI: the shared library builds, its headers ship, and the smoke
    # test that exercises it end to end passes on every platform. The DLL, .so
    # and .dylib are uploaded with vtext.h and vtext.def, so the headers have
    # exactly one source of truth and every run proves they match it.
    name: C library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            lib: libvtext.so
          - os: macos-latest
            cc: clang
            lib: libvtext.dylib
          - os: windows-latest
            cc: gcc
            lib: vtext.dll
    steps:
      - uses: actions/checkout@v4

      - name: Install V (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/vsrc"
          git clone --depth 1 https://github.com/vlang/v "$src"
          make -C "$src" -j2
          echo "$src" >> "$GITHUB_PATH"

      - name: Install V (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/vlang/v %RUNNER_TEMP%\vsrc
          pushd %RUNNER_TEMP%\vsrc
          call makev.bat
          echo %RUNNER_TEMP%\vsrc>>"%GITHUB_PATH%"

      # -gc none is load-bearing rather than an optimisation: with the Boehm
      # collector the library would free objects the C caller still holds, and
      # the caller has no handle the collector can see.
      - name: Build the shared library
        shell: bash
        run: v -shared -gc none -cc ${{ matrix.cc }} -o ${{ matrix.lib }} .
        env:
          VJOBS: '1'

      # The install name the dylib records for itself is `out` — V links with
      # its internal object name and the rename to libvtext.dylib does not
      # rewrite it — so dyld looks for `out` at runtime and the smoke binary
      # dies before main (seen as `tried: 'out' (no such file)` on CI). The id
      # must be rewritten before the smoke test links, because the load path
      # is copied from the id at link time; otool prints it before and after
      # so a future drift shows up here rather than in a missing-file error.
      - name: Fix the dylib install name (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -D ${{ matrix.lib }} || true
          install_name_tool -id @rpath/${{ matrix.lib }} ${{ matrix.lib }}
          otool -D ${{ matrix.lib }}

      # A caller thread needs a stack the 2 MB of static literals in _vinit fit
      # in, the same 32 MB reserve V gives its own executables. Linux and macOS
      # default to 8 MB main-thread stacks, which is enough; Windows defaults
      # to 1 MB, so the test binary is linked with the reserve explicitly. The
      # library is copied beside the binary everywhere, which is what the
      # loader looks at first on all three platforms.
      - name: Build and place the smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -L. -lvtext -Wl,--stack,33554432 -o examples/c-api/smoke.exe
          cp vtext.dll examples/c-api/

      - name: Build and place the smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -L. -lvtext -Wl,-rpath,'$ORIGIN' -o examples/c-api/smoke
          cp libvtext.so examples/c-api/

      - name: Build and place the smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          gcc examples/c-api/smoke.c -L. -lvtext -Wl,-rpath,@loader_path -o examples/c-api/smoke
          cp libvtext.dylib examples/c-api/

      # ls first: a missing binary or a missing library beside it is otherwise
      # a bare 127 with no failing command to read. The .exe probe is for
      # Windows, where the binary is smoke.exe and a bare ./smoke is a
      # command-not-found rather than a run.
      - name: Run the smoke test
        shell: bash
        run: |
          ls -la
          if [ -f smoke.exe ]; then ./smoke.exe ../../testdata/fonts/Amiri-Regular.ttf; else ./smoke ../../testdata/fonts/Amiri-Regular.ttf; fi
        working-directory: examples/c-api

      - name: MinGW import library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: dlltool -d vtext.def --dllname vtext.dll -l libvtext.dll.a

      - name: Upload the C library and headers
        uses: actions/upload-artifact@v4
        with:
          name: c-lib-${{ matrix.os }}
          path: |
            vtext.h
            vtext.def
            ${{ matrix.lib }}

      - name: Upload the MinGW import library (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: c-lib-windows-import
          path: libvtext.dll.a
